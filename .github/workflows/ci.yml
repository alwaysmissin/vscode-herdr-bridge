name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const expected = 'v' + require('./package.json').version;
          if (process.env.RELEASE_TAG !== expected) {
          console.error('Tag ' + process.env.RELEASE_TAG + ' does not match ' + expected);
          process.exit(1); }"

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run VS Code integration test
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npm run package

      - name: Generate checksum
        run: sha256sum vscode-herdr-bridge.vsix > vscode-herdr-bridge.vsix.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-herdr-bridge-${{ github.sha }}
          path: |
            vscode-herdr-bridge.vsix
            vscode-herdr-bridge.vsix.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged extension
        uses: actions/download-artifact@v8
        with:
          name: vscode-herdr-bridge-${{ github.sha }}

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          vscode-herdr-bridge.vsix
          vscode-herdr-bridge.vsix.sha256
          --verify-tag
          --generate-notes
          --title "$RELEASE_TAG"
